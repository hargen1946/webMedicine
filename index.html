<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6750a4">
  <meta name="description" content="QRコードから処方情報を記録できる、ブラウザ版お薬手帳">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=6">
  <style>
    .camera-frame{height:min(52dvh,440px);min-height:280px;aspect-ratio:auto}
    .camera-frame video{width:100%!important;height:100%!important;min-height:0;object-fit:cover!important}
    .scan-guide{position:absolute;width:78%;aspect-ratio:1;left:11%;top:50%;translate:0 -50%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 999px #0005;pointer-events:none}
    .scan-choice{display:grid;gap:10px;margin:4px 0 13px}
    #scanner-status{font-size:18px;font-weight:800;color:#333}
    .scan-count{color:#d40000}
  </style>
  <title>お薬手帳</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="back-button" class="icon-button hidden" type="button" aria-label="戻る">←</button>
      <div class="brand"><span class="brand-mark">✚</span><span id="header-title">お薬手帳</span></div>
      <button id="install-button" class="install-button hidden" type="button">インストール</button>
    </header>
    <main id="app" tabindex="-1"></main>
  </div>

  <dialog id="scanner-dialog" class="scanner-dialog">
    <div class="scanner-head">
      <strong>QRコードを読み取る</strong>
      <button id="close-scanner" class="icon-button" type="button" aria-label="閉じる">×</button>
    </div>
    <div id="qr-reader" class="camera-frame" aria-label="QRコード読み取りカメラ">
      <video id="camera-video" autoplay muted playsinline></video>
      <canvas id="scan-canvas" hidden></canvas>
      <div class="scan-guide" aria-hidden="true"></div>
    </div>
    <p id="scanner-status" class="hint" aria-live="polite">カメラを起動しています…</p>
    <div id="scan-choice" class="scan-choice hidden">
      <button id="scanner-next" class="button orange" type="button">次のQRコードを読む</button>
      <button id="scanner-finish" class="button success" type="button">読み取り終了</button>
    </div>
    <div class="scanner-actions">
      <button id="show-paste" class="button ghost" type="button">読み取りデータを貼り付ける</button>
    </div>
    <div id="paste-panel" class="paste-panel hidden">
      <label for="qr-text">QRコードの文字データ</label>
      <textarea id="qr-text" rows="7" placeholder="JAHISデータを貼り付けてください"></textarea>
      <button id="add-qr-text" class="button primary" type="button">このデータを追加</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="zxing-browser.min.js?v=0.2.1"></script>
  <script src="app.js?v=6" defer></script>
</body>
</html>
