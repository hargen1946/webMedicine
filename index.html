<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>お薬手帳</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=13">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="theme-color" content="#6750a4">
</head>
<body>
  <div class="app-shell">
    <!-- 上部ヘッダー -->
    
    <header class="topbar">
      <button id="back-button" class="icon-button hidden" type="button" aria-label="前の画面へ戻る">← 戻る</button>
      <div id="header-title" class="brand">お 薬 手 帳</div>
      <button id="install-button" class="install-button hidden">ホームにアイコンを置く</button>
    </header>

    <!-- メイン画面（app.jsによって中身が切り替わります） -->
    <main id="app" tabindex="-1"></main>
  </div>

  <!-- QRコード読み取り画面 -->

  <dialog id="scanner-dialog" class="scanner-dialog">
    <div class="scanner-head">
      <div id="scanner-status">QRコードをカメラに映してください</div>
      <button id="close-scanner" class="icon-button" aria-label="閉じる">×</button>
    </div>
    <div class="camera-frame">
      <video id="camera-video" playsinline></video>
      <!-- 白線の枠ガイド（カメラ動作中のみ表示） -->
      <div id="scan-guide" class="scan-guide"></div>
    </div>
    <div id="scanner-tools" class="scanner-tools">
      <button id="scanner-file" class="button secondary" type="button">QR画像から読み取る</button>
      <input id="qr-image-input" class="hidden" type="file" accept="image/*">
      <p class="scanner-tip">枠いっぱいにせず、QRコードの周囲に少し余白が見える距離で静止してください。</p>
    </div>
    <div id="scan-choice" class="scan-choice hidden">
      <button id="scanner-next" class="button orange hidden">次のQRコードを読む</button>
      <button id="scanner-finish" class="button success hidden">読み取り終了・保存</button>
      <button id="scanner-back" class="button secondary hidden">中止してホームへ</button>
    </div>
  </dialog>
  

  <!-- インストール案内画面 -->
  <dialog id="install-guide-dialog" class="install-guide-dialog">
    <h2 style="font-size:18px; color:var(--primary); margin-bottom:12px;">ホーム画面に追加</h2>
    <p style="font-size:15px; line-height:1.5;">このアプリをホーム画面に追加すると、アイコンからすぐに起動できるようになります。</p>
    <div class="install-guide-actions">
      <button id="install-guide-back" class="button ghost" style="flex:1;">キャンセル</button>
      <button id="install-guide-next" class="button primary" style="flex:1;">追加する</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- QRコード読み取り用ライブラリ (ZXing-C++ Wasm公式 reader バンドル) -->
  <script src="./vendor/zxing-wasm/index.js"></script>

  <!-- 分割した機能モジュール（依存関係順に確実に同期実行） -->
  <script src="./audio.js?v=13"></script>
  <script src="./storage.js?v=13"></script>
  <script src="./parser.js?v=13"></script>
  <script src="./camera.js?v=13"></script>
  <script src="./app.js?v=13"></script>
</body>
</html>
