<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お薬手帳</title>
    <style>
        /* 画面全体のデザイン設定 */
        body {
            font-family: sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        /* 画面の切り替え用設定 */
        .view {
            display: none;
        }
        #home {
            display: block; /* 最初はホーム画面を表示 */
        }
        /* ボタンのデザイン */
        button {
            padding: 12px 24px;
            font-size: 1.1em;
            margin: 10px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        /* カメラの画面デザイン */
        #video {
            width: 100%;
            max-width: 400px;
            background-color: #000;
            border-radius: 8px;
        }
        #statusText {
            margin: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>お薬手帳</h1>

    <!-- 1. ホーム画面 -->
    <div id="home" class="view">
        <p>ようこそ！ボタンを押して読み取りを開始してください。</p>
        <button onclick="navigate('scanner')">QRコードを読み取る</button>
    </div>

    <!-- 2. スキャン（カメラ）画面 -->
    <div id="scanner" class="view">
        <video id="video" autoplay playsinline></video>
        <div id="statusText">カメラを起動しています...</div>
        <div id="scanChoice" style="display: none;">
            <button>次のデータを読み込む</button>
        </div>
        <br>
        <button onclick="closeScanner()">ホームに戻る</button>
    </div>

    <!-- 3. メッセージ表示用ダイアログ -->
    <dialog id="dialog">
        <p>確認メッセージ</p>
        <button onclick="dialog.close()">閉じる</button>
    </dialog>

    <!-- ここで app.js（裏側の動き）を読み込みます -->
    <script src="app.js"></script>
</body>
</html>
